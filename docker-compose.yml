# KR App — production stack (aaPanel / any Docker host)
#
# Semua variabel (termasuk rahasia) dibaca dari file .env melalui env_file —
# tidak ada interpolasi rahasia di dalam YAML ini.
# .env TIDAK pernah di-commit. Lihat .env.example untuk daftar lengkap.
#
# Catatan Docker: DATABASE_URL di .env harus menunjuk host `postgres`
# (nama service di jaringan internal), contoh:
#   DATABASE_URL=postgresql://kr_user:***@postgres:5432/kr_production

services:
  postgres:
    # PostgreSQL 17 — menyamai server sumber Supabase (17.6.1 menurut
    # supabase/.temp/postgres-version). Restore dump lintas major version ke
    # bawah tidak didukung PostgreSQL; target harus >= major sumber.
    image: postgres:17-alpine
    container_name: kr-postgres
    restart: unless-stopped
    # Image postgres membaca POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB
    # langsung dari environment (diisi via env_file).
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Tidak ada published port: hanya terjangkau app via jaringan internal.
    networks:
      - kr-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kr-app
    restart: unless-stopped
    ports:
      # Loopback saja; Nginx aaPanel reverse-proxy 443 -> 127.0.0.1:3000
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      # Konstanta runtime (bukan rahasia) — menimpa nilai .env bila ada.
      NODE_ENV: production
      PORT: "3000"
      HOST: 0.0.0.0
      LOCAL_STORAGE_PATH: /app/storage
    volumes:
      # Media persisten di luar container; recreate kr-app tidak menghapusnya.
      - storage_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kr-internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  pgdata:
    name: kr_pgdata
  storage_data:
    name: kr_storage

networks:
  kr-internal:
    name: kr_network
    driver: bridge
